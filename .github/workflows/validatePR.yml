name: Validate the pull request body.
description: 'Checks that the PR meets the requirements.'

# The requirements are:
#   The DCO box must be checked.
#   The comments must be removed.
#   There can be no blank sections.

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

jobs:
  check_pull_request:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check for DCO certification
        id: dco
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # This is the string used to find the DCO check box.
          DCO_CHECKBOX: 'I attest that myself and any co-authors'  
          UNCHECKED="\[ \] .*$DCO_CHECKBOX.*"
          if echo "${BODY}" | grep -q "$UNCHECKED"; then
            echo "The DCO certification checkbox must be checked."
            echo "Review the DCO and ensure that you have checked the box in the pull request description."
            exit 1
          else
            echo "The DCO certification checkbox not found in pull request description."
            echo "Be sure you are using the pull request template, which includes the DCO certification checkbox."
            exit 1
          fi
      - name: Check for placeholder text
        id: placeholder_text
        if: always()
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "${BODY}" | grep -q "^> _.*\._$"; then
            echo "All placeholder text (> _..._) must be removed from the pull request description."
            exit 1
          fi
      - name: Check for blank sections
        id: blank_sections
        if: always()
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import re, os, sys
          body = os.environ.get("BODY", "")
          if re.search(r'(?m)^###[^\n]*\n(\s*\n)+###', body):
            print("Blank sections must be removed from the pull request description.")
            sys.exit(1)
          EOF
      - name: Final check
        if: always()
        run: |
          failed=0
          [ "${{ steps.dco.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.placeholder_text.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.blank_sections.outcome }}" = "failure" ] && failed=1

          if [ "$failed" -eq 1 ]; then
            echo "Pull request description validation failed."
            echo "See the failed tasks above to diagnose the issue(s)."
            exit 1
          else
            echo "Pull request validation passed."
            exit 0 
          fi
